type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - photo
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '380637944763'
  email:
    description: "Contact's email"
    type: string
    example: 'olena.example@gmail.com'
  isFavourite:
    description: "Contact's favourite"
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    example: work
  photo:
    description: "Link to student's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
