type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - photo
properties:
  _id:
    description: 'Contact id'
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: 'Contact name'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Contact phone number'
    type: string
    example: '380637944763'
  email:
    description: 'Contact email'
    type: string
    example: 'olena.example@gmail.com'
  isFavourite:
    description: 'Contact favourite'
    type: boolean
    example: false
  contactType:
    description: 'Contact type'
    type: string
    example: work
  photo:
    description: 'Link to contact photo'
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
