tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContactById
description: >
  Deletes a contact from the database by its unique ID.
  Requires a valid Bearer token for authorization.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: Unique identifier of the contact
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
responses:
  '200':
    description: Successfully deleted contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact successfully deleted
  '404':
    description: Contact not found
