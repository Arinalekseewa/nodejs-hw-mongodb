tags:
  - Contact
summary: Update contact by ID
operationId: updateContactById
description: >
  Updates an existing contact in the database by its ID.
  Only the fields provided in the request body will be updated.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: Unique identifier of the contact
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Jane Doe'
          phoneNumber:
            type: string
            example: '380637944763'
          email:
            type: string
            example: 'jane.doe@example.com'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            example: personal
          photo:
            type: string
            example: https://res.cloudinary.com/uqwgdu/image/upload/image2.png
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact successfully updated
            data:
              $ref: '../../../components/schemas/contacts.yaml'
  '400':
    description: Invalid input data
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid input data
  '404':
    description: Contacts not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contacts not found
