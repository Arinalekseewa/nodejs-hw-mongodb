tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: >
  Updates an existing contact in the database by its ID.
  Only the fields provided in the request body will be updated.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: Unique identifier of the contact
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Jane Doe'
            description: Optional. New name of the contact.
          phoneNumber:
            type: string
            example: '380637944763'
            description: Optional. New phone number.
          email:
            type: string
            example: 'jane.doe@example.com'
            description: Optional. New email address.
          isFavourite:
            type: boolean
            example: true
            description: Optional. Update favourite status.
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: personal
            description: Optional. Update type of contact.
          photo:
            type: string
            format: binary
            description: Optional. New photo file for the contact.
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact successfully updated
            data:
              type: object
              required:
                - _id
                - name
                - phoneNumber
                - email
                - isFavourite
                - contactType
                - photo
              properties:
                _id:
                  type: string
                  example: '65ca67e7ae7f10c88b598384'
                name:
                  type: string
                  example: 'Jane Doe'
                phoneNumber:
                  type: string
                  example: '380637944763'
                email:
                  type: string
                  example: 'jane.doe@example.com'
                isFavourite:
                  type: boolean
                  example: true
                contactType:
                  type: string
                  enum: ['work', 'home', 'personal']
                  example: personal
                photo:
                  type: string
                  example: 'https://res.cloudinary.com/uqwgdu/image/upload/image2.png'
  '400':
    description: Invalid input data
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid input data
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
