tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: 'Contact name'
            type: string
            example: 'Jane Doe'
          phoneNumber:
            description: 'Contact phone number'
            type: string
            example: '380637944763'
          isFavourite:
            description: 'Contact favourite'
            type: boolean
            example: true
          email:
            description: 'Contact email'
            type: string
            example: 'jane.doe@example.com'
          contactType:
            description: 'Contact type'
            type: string
            enum: ['work', 'home', 'personal']
            example: personal
          photo:
            description: 'Contact photo'
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: ../../components/schemas/contacts.yaml
  '400':
    description: Invalid input data
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid input data
